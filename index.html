<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #bbf280;">

  <div id="interestForm">
<h2>Compound Interest Calculator</h2>
    <form >
      
  <label for="principal">Principal Amount (Rs.):</label><br>
  <input class="form-control" type="number" id="principal" required><br><br>

  <label for="rate">Annual Interest Rate (%):</label><br>
  <input class="form-control" type="number" id="rate" step="0.1" required><br><br>

  <label for="time">Time (Years):</label><br>
  <input class="form-control" type="number" id="time" step="0.1" required><br><br>

  <button class="btn btn-success" type="button" onclick="calculateInterest()">Calculate</button>
  <button class="btn btn-warning" type="button" onclick="resetForm()">Reset</button>
</form>
<br>

<h3>Result:</h3>
<p id="result">Enter values and click calculate.</p>
</div>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
